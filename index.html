<style>
/* Layout: one phone-width column of chunky sticker cards over a floating doodle sky.
   Boldness lives in the display type + offset-shadow cards; everything else stays calm. */
:root {
  --bg: #f3ebff;
  --card: #ffffff;
  --text: #231942;
  --line: #231942;
  --muted: #6d6490;
  --pink: #ff9ccf;
  --lime: #c9f26b;
  --sun: #ffd94d;
  --sky: #98d8ff;
  --good: #b9f28c;
  --bad: #ff9aa8;
  --on-pop: #231942;
  --doodle: #b9a4f0;
  --display: "Bagel Fat One", "Arial Rounded MT Bold", system-ui, sans-serif;
  --body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1a1331; --card: #2a2150; --text: #f6f0ff; --line: #0c0720; --muted: #b3a8d9; --doodle: #4a3d86;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1a1331; --card: #2a2150; --text: #f6f0ff; --line: #0c0720; --muted: #b3a8d9; --doodle: #4a3d86;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background: var(--bg); color: var(--text); font-family: var(--body); font-size: 16px; line-height: 1.4;
  padding-inline: 16px; padding-block: 20px 48px; overflow-x: hidden; -webkit-tap-highlight-color: transparent;
}
#doodles { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
#doodles svg { position: absolute; color: var(--doodle); animation: bob 6s ease-in-out infinite; }
@keyframes bob { 0%,100% { transform: translateY(0) rotate(var(--r)); } 50% { transform: translateY(-10px) rotate(calc(var(--r) + 8deg)); } }
#app { position: relative; z-index: 1; max-width: 440px; margin-inline: auto; }
.screen { display: flex; flex-direction: column; gap: 16px; animation: pop .35s cubic-bezier(.2,1.4,.4,1); }
@keyframes pop { from { opacity: 0; transform: translateY(14px) scale(.96); } to { opacity: 1; transform: none; } }

h1, h2, h3 { font-family: var(--display); font-weight: 400; margin: 0; text-wrap: balance; letter-spacing: .01em; }
p { margin: 0; }
.card { background: var(--card); border: 3px solid var(--line); border-radius: 24px; box-shadow: 0 6px 0 var(--line); padding: 18px; min-width: 0; }
.center { text-align: center; align-items: center; }

/* logo */
.logo { display: flex; flex-direction: column; align-items: center; gap: 0; margin-top: 4px; }
.logo .l1, .logo .l2 { font-family: var(--display); line-height: .9; text-shadow: 0 5px 0 var(--line); -webkit-text-stroke: 3px var(--line); paint-order: stroke fill; }
.logo .l1 { font-size: clamp(64px, 22vw, 92px); color: var(--pink); transform: rotate(-4deg); }
.logo .l2 { font-size: clamp(64px, 22vw, 92px); color: var(--lime); transform: rotate(3deg); margin-top: -6px; }
.sticker { position: absolute; font-family: var(--display); font-size: 15px; background: var(--sun); color: var(--on-pop); border: 3px solid var(--line); border-radius: 999px; padding: 4px 12px; transform: rotate(8deg); box-shadow: 0 3px 0 var(--line); }
.hero { position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.hero .sticker { right: 0; top: 6px; }
.hero .mascot { margin-top: 4px; }
.tagline { font-size: 19px; font-weight: 800; text-align: center; text-wrap: balance; }

/* buttons */
.btn { font: inherit; font-family: var(--display); font-size: 20px; color: var(--on-pop); background: var(--pink); border: 3px solid var(--line); border-radius: 18px; padding: 14px 18px; box-shadow: 0 6px 0 var(--line); cursor: pointer; width: 100%; transition: transform .08s, box-shadow .08s; text-wrap: balance; }
.btn:hover { transform: translateY(-2px); box-shadow: 0 8px 0 var(--line); }
.btn:active { transform: translateY(5px); box-shadow: 0 1px 0 var(--line); }
.btn:focus-visible, .opt:focus-visible, input:focus-visible { outline: 4px solid var(--sky); outline-offset: 3px; }
.btn.lime { background: var(--lime); }
.btn.sun { background: var(--sun); }
.btn.sky { background: var(--sky); }
.btn.big { font-size: 24px; padding: 18px; }
.btn.ghost { background: var(--card); color: var(--text); }
.btn[disabled] { opacity: .5; pointer-events: none; }
.wiggle { animation: wig 2.4s ease-in-out infinite; }
@keyframes wig { 0%,88%,100% { transform: rotate(0); } 90% { transform: rotate(-2deg); } 94% { transform: rotate(2deg); } 97% { transform: rotate(-1deg); } }

/* steps */
.steps { display: grid; gap: 12px; padding: 0; margin: 0; list-style: none; }
.steps li { display: flex; gap: 12px; align-items: center; font-weight: 700; }
.steps .n { flex: none; width: 38px; height: 38px; border-radius: 50%; border: 3px solid var(--line); display: grid; place-items: center; font-family: var(--display); color: var(--on-pop); }
.steps li:nth-child(1) .n { background: var(--sun); }
.steps li:nth-child(2) .n { background: var(--sky); }
.steps li:nth-child(3) .n { background: var(--pink); }
.fine { font-size: 13px; color: var(--muted); text-align: center; font-weight: 500; }

/* inputs */
label.lab { font-weight: 800; font-size: 14px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
input[type=text] { font: inherit; font-size: 22px; font-weight: 800; width: 100%; background: var(--bg); color: var(--text); border: 3px solid var(--line); border-radius: 16px; padding: 14px 16px; }
input[type=text]::placeholder { color: var(--muted); opacity: .7; }

/* quiz */
.topbar { display: flex; align-items: center; gap: 10px; justify-content: space-between; }
.pips { display: flex; gap: 5px; flex: 1; min-width: 0; }
.pip { flex: 1; height: 12px; border-radius: 99px; border: 2.5px solid var(--line); background: var(--card); transition: background .2s; }
.pip.now { background: var(--sun); }
.pip.ok { background: var(--good); }
.pip.no { background: var(--bad); }
.pip.set { background: var(--sky); }
.count { font-family: var(--display); font-size: 16px; white-space: nowrap; }
.chip { align-self: flex-start; font-weight: 800; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; background: var(--lime); color: var(--on-pop); border: 2.5px solid var(--line); border-radius: 99px; padding: 4px 12px; }
.chip.pk { background: var(--pink); }
.q { font-family: var(--display); font-size: clamp(24px, 7.2vw, 30px); line-height: 1.15; text-wrap: balance; }
.opts { display: grid; gap: 12px; }
.opt { font: inherit; font-weight: 700; font-size: 16.5px; text-align: left; color: var(--text); background: var(--card); border: 3px solid var(--line); border-radius: 20px; box-shadow: 0 5px 0 var(--line); padding: 12px 14px; display: flex; gap: 12px; align-items: center; cursor: pointer; transition: transform .08s, box-shadow .08s, background .15s, opacity .2s; min-width: 0; }
.opt span.t { min-width: 0; overflow-wrap: anywhere; }
.opt .k { flex: none; width: 34px; height: 34px; border-radius: 12px; border: 3px solid var(--line); display: grid; place-items: center; font-family: var(--display); color: var(--on-pop); }
.opt:nth-child(1) .k { background: var(--sun); }
.opt:nth-child(2) .k { background: var(--sky); }
.opt:nth-child(3) .k { background: var(--pink); }
.opt:nth-child(4) .k { background: var(--lime); }
.opt:hover { transform: translateY(-2px); box-shadow: 0 7px 0 var(--line); }
.opt:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--line); }
.opts.done .opt { pointer-events: none; opacity: .5; transform: none; box-shadow: 0 3px 0 var(--line); }
.opts.done .opt.real { opacity: 1; background: var(--good); color: var(--on-pop); animation: boing .5s cubic-bezier(.2,1.6,.4,1); }
.opts.done .opt.miss { opacity: 1; background: var(--bad); color: var(--on-pop); animation: shake .45s; }
.opts.done .opt.mine { opacity: 1; background: var(--sun); color: var(--on-pop); animation: boing .4s; }
.opt .tag { margin-left: auto; flex: none; font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; border: 2.5px solid var(--line); background: var(--card); color: var(--text); border-radius: 99px; padding: 2px 8px; }
@keyframes boing { 0% { transform: scale(.94); } 60% { transform: scale(1.04); } 100% { transform: scale(1); } }
@keyframes shake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-8px); } 40% { transform: translateX(8px); } 60% { transform: translateX(-5px); } 80% { transform: translateX(5px); } }

.reveal { display: flex; flex-direction: column; gap: 12px; animation: pop .35s cubic-bezier(.2,1.4,.4,1); }
.react { display: flex; gap: 12px; align-items: center; }
.react .mascot { flex: none; }
.bubble { position: relative; flex: 1; min-width: 0; background: var(--card); border: 3px solid var(--line); border-radius: 20px; padding: 10px 14px; box-shadow: 0 4px 0 var(--line); }
.bubble b { font-family: var(--display); font-weight: 400; font-size: 22px; line-height: 1.1; display: block; text-wrap: balance; }
.bubble small { display: block; margin-top: 4px; font-size: 14px; font-weight: 600; color: var(--muted); overflow-wrap: anywhere; }

/* result */
.score { font-family: var(--display); font-size: clamp(80px, 28vw, 120px); line-height: .95; color: var(--pink); -webkit-text-stroke: 3px var(--line); paint-order: stroke fill; text-shadow: 0 6px 0 var(--line); }
.score small { font-size: .4em; color: var(--lime); }
.title { font-size: clamp(28px, 8.5vw, 38px); line-height: 1.05; }
.blurb { font-weight: 600; font-size: 17px; text-wrap: balance; }
.linkbox { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 13px; background: var(--bg); border: 3px dashed var(--line); border-radius: 14px; padding: 10px 12px; word-break: break-all; user-select: all; -webkit-user-select: all; text-align: left; width: 100%; }
.stack { display: flex; flex-direction: column; gap: 12px; width: 100%; }

.mascot { display: block; overflow: visible; }
.mascot.float { animation: floaty 3s ease-in-out infinite; }
@keyframes floaty { 0%,100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-8px) rotate(3deg); } }

#fx { position: fixed; inset: 0; pointer-events: none; z-index: 5; overflow: hidden; }
#fx i { position: absolute; font-style: normal; font-size: 28px; animation: fly 1.3s ease-out forwards; }
@keyframes fly { 0% { transform: translate(0,0) scale(.4) rotate(0); opacity: 1; } 100% { transform: translate(var(--dx), var(--dy)) scale(1.2) rotate(var(--dr)); opacity: 0; } }
.langbar { position: relative; z-index: 2; max-width: 440px; margin: 0 auto 12px; display: flex; justify-content: flex-end; }
.lang { display: inline-flex; border: 3px solid var(--line); border-radius: 99px; background: var(--card); box-shadow: 0 3px 0 var(--line); overflow: hidden; }
.lang button { font: inherit; font-weight: 800; font-size: 13px; color: var(--text); background: transparent; border: 0; padding: 6px 12px; cursor: pointer; }
.lang button[aria-pressed="true"] { background: var(--sun); color: var(--on-pop); }
.lang button:focus-visible { outline: 3px solid var(--sky); outline-offset: -3px; }
#toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 30px); background: var(--text); color: var(--bg); font-weight: 800; padding: 10px 18px; border-radius: 99px; opacity: 0; transition: .25s; z-index: 6; pointer-events: none; max-width: calc(100% - 32px); text-align: center; }
#toast.on { opacity: 1; transform: translate(-50%, 0); }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>

  /* ---------- events ---------- */
  $app.addEventListener("click", function (e) {
    var t = e.target.closest("[data-act]"); if (!t) return;
    var a = t.getAttribute("data-act");
    var x = X();
    if (a === "start-create") { if (location.hash) { try { history.replaceState(null, "", location.href.split("#")[0]); } catch (z) {} } S.name = ""; createName(); }
    else if (a === "home") landing();
    else if (a === "name-go") nameGo();
    else if (a === "opt") onOpt(+t.getAttribute("data-n"));
    else if (a === "next") { if (S.i < 9) { S.i++; S.busy = false; question(); } else result(); }
    else if (a === "copy-link") copy(x.caption(S.name, shareLink(S.token)));
    else if (a === "preview") { S.pName = x.me; S.i = 0; S.picks = []; S.mode = "play"; question(); }
    else if (a === "again") { S.name = ""; createName(); }
    else if (a === "pstart") pStart();
    else if (a === "retry") { S.i = 0; S.picks = []; S.mode = "play"; question(); }
    else if (a === "copy-result") copy(x.resTxt(S.name, S.score, x.tiers[S.tierIdx].t, shareLink(S.token || encodeQuiz(S.name, S.ans))), x.copiedRes);
  });

  /* language switch: re-draw the current screen in the other language */
  function rerender() {
    var m = S.mode;
    if (m === "landing") landing();
    else if (m === "cname") createName();
    else if (m === "create") question();
    else if (m === "share") finishCreate();
    else if (m === "pintro") playIntro();
    else if (m === "play") { S.picks.length = S.i; question(); }
    else if (m === "result") result();
  }
  var langBtns = document.querySelectorAll(".lang button");
  function syncLang() {
    Array.prototype.forEach.call(langBtns, function (b) { b.setAttribute("aria-pressed", b.getAttribute("data-lang") === L ? "true" : "false"); });
    document.documentElement.setAttribute("lang", L === "en" ? "en" : "tcy-Latn");
  }
  Array.prototype.forEach.call(langBtns, function (b) {
    b.addEventListener("click", function () {
      var nl = b.getAttribute("data-lang");
      if (nl === L) return;
      L = nl; try { localStorage.setItem("sd_lang", L); } catch (e) {}
      syncLang(); rerender();
    });
  });

  function route() {
    var tok = (location.hash || "").replace(/^#/, "");
    var q = tok ? decodeQuiz(tok) : null;
    if (q) { S.name = q.name; S.ans = q.ans; S.token = tok; S.pName = ""; playIntro(); }
    else landing();
  }
  window.addEventListener("hashchange", route);

  syncLang();
  buildDoodles();
  route();
})();
</script>
